<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit Card Form</title>
  <link rel="stylesheet" href="stylesheet.css">
  <link rel="icon" href="images/x_ico.ico" type="image/x-icon">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card-container">
    <!-- Card Front -->
    <section class="card front">
      <h3 class="total">TOTAL: $199💳</h3>
      <form id="creditFormFront" class="card-grid">
        <div class="field wide">
          <label for="cardNumber">CARD NUMBER</label>
          <input type="text" id="cardNumber" name="cardNumber" 
                 required maxlength="16" pattern="\d{16}" placeholder="1234 5678 9101 1020">
        </div>

        <div class="row">
          <div class="field short">
            <label for="cardName">CARD HOLDER</label>
            <input type="text" id="cardName" name="cardName" required placeholder="John Doe">
          </div>

          <div class="field short right">
            <label id="expirationDate">EXPIRATION</label>
            <div class="expiration-inputs">
              <input type="text" id="month" name="expMonth" placeholder="MM" aria-labelledby="expirationDate" required pattern="\d{2}" class="small-input">
              <input type="text" id="year" name="expYear" placeholder="YY" aria-labelledby="expirationDate" required pattern="\d{2}" class="small-input">
            </div>
          </div>
        </div>
      </form>
    </section>

    <!-- Card Back -->
    <section class="card back">
      <div class="magnetic-strip"></div>
      <form id="creditFormBack" class="card-grid">
        <div class="field small-cvv">
          <label for="cvv">CVC/CVV</label>
          <input type="text" id="cvv" name="cvv" required maxlength="3" pattern="\d{3}" placeholder="xxx">
        </div>
      </form>
    </section>

    <div class="submit-container">
      <button type="submit" class="submit-btn">Submit</button>
    </div>

    <p id="feedback"></p>
  </main>
</body>
</html>
