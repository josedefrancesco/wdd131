<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="images/recipe-book.png" alt="Logo">
            <h1>RECIPEBOOK</h1>
        </div>
    </header>

    <div class="main-container">
        <div class="search-bar">
            <input type="text" placeholder="Find a recipe">
            <button><img src="images/search.svg" alt="Search"></button>
        </div>

        <hr class="separator">

        <main>
            <section class="recipe-card">
                <div class="recipe-image">
                    <img src="images/apple-crisp.jpg" alt="Apple Crisp">
                </div>
                
                <div class="recipe-info">
                    <span class="category-tag">dessert</span>
                    <h2>Apple Crisp</h2>
                    <div class="stars">⭐⭐⭐⭐☆</div>
                    <p class="description">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
                </div>
            </section>
        </main>
    </div>

    <footer>
        <div class="footer-inner">
            <div class="social-icons">
                <a href="#"><img src="images/instagram_icon.svg" alt="Instagram"></a>
                <a href="#"><img src="images/youtube_icon.svg" alt="YouTube"></a>
                <a href="#"><img src="images/pinterest_icon.svg" alt="Pinterest"></a>
            </div>
            <a href="#" class="attribution">Recipe icons created by Freepik - Flaticon</a>
        </div>
    </footer>

</body>
</html>
