<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="Discover the best recipes and desserts.">
    <meta property="og:url" content="https://josedefrancesco.github.io/wdd131/recipes/">
    <meta property="og:image" content="images/social-preview-image.png">

    <link rel="icon" href="/recipes/favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <script defer src="recipes.js"></script>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="images/recipe-book.png" alt="Logo">
            <h1>RECIPEBOOK</h1>
        </div>
    </header>

    <div class="main-container">
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Find a recipe">
            <button id="search-button"><img src="images/search.svg" alt="Search"></button>
        </div>

        <hr class="separator">

        <main id="recipe-container">
            </main>
    </div>

    <footer>
        <div class="footer-inner">
            <div class="social">
                <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
                <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
                <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
            </div>
            
            <p class="attribution">
                <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
            </p>
        </div>
    </footer>

</body>
</html>
